name: JAT Design Cloudflare V0.1 candidate
on:
  workflow_dispatch:
  push:
    paths: ['src/**','worker-tests/**','migrations/**','package*.json','tsconfig*.json','wrangler.jsonc','.github/workflows/worker.yml']
  pull_request:
    paths: ['src/**','worker-tests/**','migrations/**','package*.json','tsconfig*.json','wrangler.jsonc','.github/workflows/worker.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python3 tools/package-worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: JAT-Design-Cloudflare-V0.1-candidate
          path: |
            dist/worker/
            dist/JAT-Design-Cloudflare-V0.1-source.zip
            dist/JAT-Design-Cloudflare-V0.1-source.zip.sha256
          if-no-files-found: error
